:root{
  color-scheme: light dark;
  --ink:#12304A; --mist:#EEF3F6; --foam:#FFFFFF; --tide:#1F7A8C; --buoy:#F4B63F;
  --text:#12304A; --muted:#51697B; --line:#C9D6DE; --soft:#E1EAEF;
  --pick-bg:#12304A; --pick-ink:#FFFFFF; --btn-bg:#12304A; --btn-ink:#FFFFFF;
  --bad:#B3392F; --ok:#1F7A55;
  --serif: "Crimson Pro",Charter,"Iowan Old Style",Georgia,serif;
  --sans: "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --mist:#0C1B2A; --foam:#14283B; --text:#E8F0F5; --muted:#9DB2C2; --line:#2B4357; --soft:#1B3246;
    --tide:#5BB6C8; --pick-bg:#1F7A8C; --pick-ink:#FFFFFF; --btn-bg:#1F7A8C; --btn-ink:#FFFFFF; --bad:#F0948B; --ok:#6CC59A; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--text);font:17px/1.5 var(--sans)}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* course line: the progress indicator */
header.bar{position:sticky;top:0;z-index:5;background:var(--mist);padding:max(16px,env(safe-area-inset-top)) 20px 10px}
.course{position:relative;height:22px;margin:0 11px}
.course .line,.course .fill{position:absolute;left:0;top:10px;height:2px;border-radius:1px}
.course .line{right:0;background:var(--line)}
.course .fill{width:0;background:var(--tide);transition:width .35s ease}
.course .wp{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--mist);border:2px solid var(--line);transition:border-color .35s,background .35s}
.course .wp.done{background:var(--tide);border-color:var(--tide)}
.course .buoy{position:absolute;top:0;left:0;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--buoy);border:3px solid var(--ink);transition:left .35s ease}
@media (prefers-color-scheme: dark){ .course .buoy{border-color:var(--foam)} }
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;color:var(--muted);min-height:21px}
.meta #m-left{color:var(--text);font-weight:600}

main{flex:1;padding:6px 20px 36px}
h1,h2,legend,.route b,.hz-out{font-variant-numeric:lining-nums}
h1,h2,legend{font-family:var(--serif);font-weight:600;color:var(--text);outline:none}
h1{font-size:40px;line-height:1.06;letter-spacing:-.01em;margin:22px 0 14px}
h2{font-size:31px;line-height:1.12;letter-spacing:-.005em;margin:16px 0 8px}
legend{padding:0;font-size:30px;line-height:1.16;letter-spacing:-.005em;margin:16px 0 20px}
.lede{color:var(--muted);margin:0 0 20px}
.fine{font-size:14px;color:var(--muted);margin:14px 0}
.note{border-left:4px solid var(--tide);padding:2px 0 2px 14px;margin:0 0 20px;color:var(--muted)}
.note p{margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* welcome: the route */
.route{list-style:none;margin:26px 0 28px;padding:0 0 0 34px;position:relative}
.route::before{content:"";position:absolute;left:10px;top:10px;bottom:22px;width:2px;background:var(--line)}
.route li{position:relative;padding:0 0 20px}
.route li:last-child{padding-bottom:0}
.route li::before{content:"";position:absolute;left:-31px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--mist);border:2px solid var(--tide)}
.route li.here::before{left:-34px;top:1px;width:20px;height:20px;background:var(--buoy);border:3px solid var(--ink)}
@media (prefers-color-scheme: dark){ .route li.here::before{border-color:var(--foam)} }
.route b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2}
.route span{display:block;color:var(--muted);font-size:15px}
.resume{padding:16px 0;margin:0 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.resume p{margin:0 0 14px}

/* answers */
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:14px 16px;margin:0 0 10px;background:var(--foam);border:1.5px solid var(--line);border-radius:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,color .15s}
.opt:has(input:checked){background:var(--pick-bg);border-color:var(--pick-bg);color:var(--pick-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--tide);outline-offset:3px}
.opt input{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;margin:0;display:grid;place-content:center;background:transparent;border:2px solid var(--muted);border-radius:50%}
.opt input[type=checkbox]{border-radius:7px}
.opt input[type=radio]:checked{border-color:var(--buoy)}
.opt input[type=radio]:checked::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--buoy)}
.opt input[type=checkbox]:checked{background:var(--buoy);border-color:var(--buoy)}
.opt input[type=checkbox]:checked::before{content:"";width:6px;height:12px;margin-top:-2px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg)}

/* fields */
.field{margin:0 0 22px}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.field .hint{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:54px;padding:13px 14px;font:inherit;font-size:18px;color:var(--text);background:var(--foam);border:1.5px solid var(--line);border-radius:12px}
textarea{min-height:120px;resize:vertical}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--tide)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.field.bad input,.field.bad select{border-color:var(--bad)}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:6px 0 0}

/* investing history choices and the years slider */
fieldset.group{margin:0 0 22px}
.group .hint{display:block;font-size:14px;color:var(--muted);margin:0 0 10px}
legend.flabel{font:600 15px/1.3 var(--sans);letter-spacing:0;margin:0 0 3px;color:var(--text)}
.hz-out{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:600;margin:6px 0 4px}
.hz-out.unset{color:var(--muted);font-size:24px;font-weight:400}
.hz-row{display:flex;align-items:center;gap:10px}
.hz-row .step{flex:none;width:48px;height:48px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--foam);color:var(--text);font-size:26px;line-height:1;display:grid;place-content:center}
.hz-track{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;min-height:0;margin:20px 0 8px;padding:0;border:0;border-radius:4px;background:linear-gradient(to right,var(--tide) var(--pct,50%),var(--line) var(--pct,50%))}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--buoy);border:3px solid var(--ink)}
input[type=range]::-moz-range-track{height:8px;background:transparent}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--buoy);border:3px solid var(--ink)}
.hz.unset input[type=range]{background:var(--line)}
.hz.unset input[type=range]::-webkit-slider-thumb{background:var(--foam);border-color:var(--muted)}
.hz.unset input[type=range]::-moz-range-thumb{background:var(--foam);border-color:var(--muted)}
@media (prefers-color-scheme: dark){ input[type=range]::-webkit-slider-thumb{border-color:var(--foam)} input[type=range]::-moz-range-thumb{border-color:var(--foam)} }
.hz-ticks{position:relative;height:22px;margin:0 15px;font-size:13px;color:var(--muted)}
.hz-ticks span{position:absolute;top:0;transform:translateX(-50%)}
.hz.bad .hz-out{color:var(--bad)}

/* buttons */
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:54px;padding:0 24px;border-radius:999px;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.wide{width:100%;margin:0 0 12px}
nav.foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;padding:12px 20px max(14px,env(safe-area-inset-bottom));background:var(--mist);border-top:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){ nav.foot{background:color-mix(in srgb,var(--mist) 90%,transparent);backdrop-filter:blur(10px)} }
.meter{flex:1 0 100%;margin:0 0 -2px}
.meter .mt{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:0 0 6px;color:var(--muted)}
.meter .mt b{color:var(--text)}
.meter .mbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .mbar i{display:block;height:100%;width:0;border-radius:4px;background:var(--tide);transition:width .2s ease}
.meter.full .mt,.meter.full .mt b{color:var(--ok)} .meter.full .mbar i{background:var(--ok)}
.meter.over .mt,.meter.over .mt b{color:var(--bad)} .meter.over .mbar i{background:var(--bad)}
nav.foot #back{flex:0 0 32%}
nav.foot #next{flex:1}
nav.foot[hidden]{display:none}

/* review and finish */
ul.sum{list-style:none;margin:6px 0 22px;padding:0}
ul.sum li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
ul.sum li span{white-space:nowrap}
ul.sum b{font-weight:600;text-align:right}
ul.miss{list-style:none;margin:6px 0 22px;padding:0}
ul.miss li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.miss .btn{min-height:42px;padding:0 18px;flex:none}
.ok{color:var(--ok);font-weight:600;margin:0 0 6px}
.status{font-size:14px;color:var(--muted);margin:8px 0 14px;min-height:21px}
.done-badge{width:68px;height:68px;margin:22px 0 4px;border-radius:50%;background:var(--tide);display:grid;place-content:center}
.done-badge::after{content:"";width:16px;height:30px;margin-top:-5px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){ .course .fill,.course .buoy,.course .wp,.opt{transition:none} }

/* why we ask, consent, review rows and the confirmation */
.why{margin:0 0 10px;font-size:15px}
.why summary{cursor:pointer;color:var(--tide);font-weight:600;min-height:32px;display:flex;align-items:center}
.why p{margin:4px 0 4px;color:var(--muted)}
.draftbox{border:1.5px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:15px}
.cblock{margin:0 0 16px}.cblock strong{display:block;font-family:var(--serif);font-size:19px;font-weight:600}.cblock p{margin:2px 0 0;color:var(--muted)}
h3.rv-h{font-family:var(--serif);font-size:21px;font-weight:600;margin:22px 0 4px}
ul.rv{list-style:none;margin:0;padding:0}
ul.rv li{border-bottom:1px solid var(--line)}
.rowbtn{display:flex;width:100%;align-items:center;gap:12px;min-height:56px;padding:10px 0;background:none;border:0;text-align:left;color:var(--text)}
.rowbtn .rl{flex:0 0 38%;color:var(--muted);font-size:14px}
.rowbtn .rvv{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rowbtn .rvv.needed{color:var(--bad)}
.rowbtn .chev{flex:none;color:var(--tide);font-weight:600;font-size:14px}
.chgtag.appr{background:transparent;border:1.5px solid var(--buoy);color:var(--text)}
.chgtag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--buoy);color:#12304A;font-size:12px;font-weight:700;vertical-align:1px}
dl.sentlist{margin:10px 0 18px}
dl.sentlist h3{font-family:var(--serif);font-size:19px;margin:18px 0 4px}
dl.sentlist div{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
dl.sentlist dt{flex:0 0 40%;color:var(--muted);font-size:14px}
dl.sentlist dd{flex:1;margin:0;font-weight:600;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="course" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progress through the questionnaire">
      <div class="line"></div><div class="fill" id="fill"></div><div class="buoy" id="buoy"></div>
    </div>
    <div class="meta"><span id="m-left"></span><span id="m-right"></span></div>
  </header>
  <main id="screen" tabindex="-1" aria-live="polite"></main>
  <nav class="foot" id="foot">
    <div class="meter" id="meter" hidden><div class="mt"><span id="meter-text"></span><b id="meter-pct"></b></div><div class="mbar"><i id="meter-fill"></i></div></div>
    <button type="button" class="btn ghost" id="back">Back</button>
    <button type="button" class="btn" id="next">Next</button>
  </nav>
</div>

<script>
/* ===== SHARED CONTENT =====
   Every page (advisor tool, desktop questionnaire, phone app) is built from this file.
   Change a question, option, range or note here and rebuild: npm run build */

/* Original questionnaire, written for this tool. Not independently validated. */
const QUESTIONNAIRE_VERSION = 'original-v2';
const FIVE = ['A great deal','Quite a bit','Somewhat','Very little','Not at all'];
const TOL_Q = [
  {dim:'inv', q:'A fund you own falls 15% over two months, with no bad news about the fund itself. What are you most likely to do?',
   opts:['Sell all of it and move to cash','Sell part of it','Keep it, but check it often and worry','Keep it and stick to my plan','Buy more while it is cheaper']},
  {dim:'inv', q:'You have extra savings you will not need for at least ten years. Which mix of investments appeals to you most?',
   opts:['All in savings accounts or CDs','Mostly bonds, with a little in stocks','About half in stocks and half in bonds','Mostly stocks, with some bonds','All in stocks, including smaller and overseas companies']},
  {dim:'inv', q:'Suppose your investments fall below their previous high. How long could you wait for them to recover before you would want to change course?',
   opts:['A few weeks','About three months','About a year','Two to three years','More than three years, or I would not change course']},
  /* Loss-limit options are set from the model sheet: worst declines run 12-19% (tiers 1-2), 27-34% (3-4), 36-44% (5) and 63-81% (6). */
  {dim:'inv', q:'What is the largest drop from its peak value, over any period, that your portfolio could suffer before you would change your plan?',
   opts:['20% or less','Up to 35%','Up to 45%','Up to 65%','More than 65%'], limits:[20,35,45,65,65], openLabel:'more than 65%',
   why:'This tells your advisor how large a fall you could live through without changing your plan. It is not a prediction of what will happen.'},
  {dim:'comfort', q:'In past market declines, what did you do?',
   opts:['Sold most of my investments','Sold some of my investments','I have not invested through a decline','Held my investments','Bought more']},
  {dim:'comfort', q:'How much do headlines about falling markets affect your mood or sleep?', opts:FIVE},
  {dim:'comfort', q:'After you make a big financial decision, how do you usually feel?',
   opts:['I second-guess it for a long time','I feel uneasy for a while','My feelings are mixed','I feel mostly confident','I feel comfortable and move on quickly']},
  {dim:'exp', q:'How would you rate your own knowledge of stocks, bonds and funds?',
   opts:['None','Basic','Fair','Good','Advanced']},
  {dim:'comfort', q:'Someone you trust tells you about an investment idea that sounds promising. What do you usually do?',
   opts:['Ignore it','Research it and nearly always pass','Research it and invest a small amount','Research it and invest a meaningful amount','Act quickly before the chance passes']},
  {dim:'spec', q:'A new type of investment has no long track record, but it could double in value or lose half over three years. What share of your investments would you put in it?',
   opts:['None','Up to 2%','Up to 5%','Up to 10%','More than 10%']},
  {dim:'spec', q:'For the next year, which outcome would you pick? All three average a 4% gain.',
   opts:['A sure gain of 4%','An even chance of gaining 8% or gaining nothing','An even chance of gaining 14% or losing 6%'], scores:[1,3,5]},
  {dim:'spec', q:'Suppose you must accept one of these outcomes for next year. All three average a 6% loss.',
   opts:['A sure loss of 6%','An even chance of losing 12% or losing nothing','An even chance of losing 20% or gaining 8%'], scores:[1,3,5]}
];
const tolScore = (qi, v) => { const q=TOL_Q[qi]; return q.scores ? q.scores[v-1] : v; };
/* Pairs of questions that should point the same way. A gap of 3 or more points is flagged. */
const TOL_PAIRS = [
  [0,4,'their stated reaction to a 15% drop','what they did in past declines'],
  [0,3,'their stated reaction to a 15% drop','the largest decline from peak they said they could accept'],
  [1,3,'the investment mix they prefer','the largest decline from peak they said they could accept']
];
const tolWord = v => v<=2?'low':v===3?'moderate':'high';

/* ----- record format ----- */
const RECORD_SCHEMA = 'client-risk-profile/1';
const BAND_SCALE = 6;

/* ----- firm and privacy wording -----
   The consent screen is built from these values. While approvedBy is empty the screen carries a visible
   "draft" banner, so wording that compliance has not approved cannot go out looking final. */
const PRIVACY = {
  version: 'draft-1',
  firm: 'GB Asset Management',
  retention: '',     /* how long answers are kept after they are sent. Compliance fills this in. */
  contact: '',       /* where a client sends questions about their information, such as an email address */
  approvedBy: ''     /* compliance reviewer and date, for example 'J. Smith, 2026-12-01'. Leave empty while the wording is a draft. */
};
function privacyBlocks(){
  const firm=PRIVACY.firm;
  return [
    {title:'What we collect', text:'Your answers to this questionnaire: details about you and your household, your finances and investments, and how you feel about investment risk.'},
    {title:'Who sees it', text:'Your advisor at '+firm+' and the people at '+firm+' who help your advisor.'},
    {title:'How it is stored and sent', text:'While you fill this in, your progress is saved on this device only. When you finish, you send your answers to your advisor yourself. Nothing is sent before then. '+editWindowText()},
    {title:'How long we keep it', text:PRIVACY.retention||'[How long '+firm+' keeps your answers will be set by its compliance team.]'},
    {title:'Your choices', text:'You can delete your answers from this device at any time. '+(PRIVACY.contact?'To ask about your information after you have sent it, contact '+PRIVACY.contact+'.':'[The contact for questions about your information will be added by '+firm+'.]')}
  ];
}
/* ----- how long a client can change answers after sending -----
   Saved answers on the phone are deleted this many days after sending, and a file older than this cannot be reopened for
   changes. With EDIT_WINDOW_STRICT set to false, older files can still be reopened. The wording below follows the setting. */
const EDIT_WINDOW_DAYS = 7;
const EDIT_WINDOW_STRICT = true;
const editDeadline = iso => { const t=new Date(iso).getTime(); return isNaN(t)?null:new Date(t+EDIT_WINDOW_DAYS*86400000); };
const longDate = d => d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
const AFTER_WINDOW = () => EDIT_WINDOW_STRICT ? 'you will need to start again.' : 'your saved answers are deleted. You can still change them later by opening the file you sent.';
const editWindowText = () => 'After you send your answers you have '+EDIT_WINDOW_DAYS+' days to change them. After that '+(EDIT_WINDOW_STRICT?'your saved answers are deleted and you will need to start again.':'your saved answers are deleted. You can still change them later by opening the file you sent.');
const editWindowTextDesktop = () => 'After you download your answers you have '+EDIT_WINDOW_DAYS+' days to change them, by opening the file with the Update answers I sent earlier button. After that '+(EDIT_WINDOW_STRICT?'you will need to start again.':'you can still open the file, but your advisor may ask you to start again.');
const editUntilText = iso => { const d=editDeadline(iso); return d?'You can change these answers until '+longDate(d)+'. After that '+AFTER_WINDOW():''; };
const CONSENT_LABEL = 'I have read this and I agree to share my answers with my advisor.';
const makeConsent = (now=new Date()) => ({version:PRIVACY.version, acceptedAt:now.toISOString(), approved:!!PRIVACY.approvedBy});

/* ----- changes that need the advisor's approval -----
   When a client changes one of these answers after sending, the change waits for the advisor to approve it.
   The default set is every risk question plus the finance answers that feed the capacity score. */
const APPROVAL_KEYS = ['cap:horizon','cap:income','cap:emergency','cap:withdrawal','cap:liquidity','cap:debt','cap:dependents','cap:networth'];
const needsApproval = key => /^q:\d+$/.test(String(key)) || APPROVAL_KEYS.includes(String(key));
const APPROVAL_NOTE = 'Changes to this answer need your advisor\u2019s approval before they take effect.';

/* ----- "why we ask" notes ----- */
const WHY = {
  income:'Your income helps your advisor judge how steady your plans are and how much you could add to your savings. A range is enough.',
  debtTotal:'Debt payments reduce what you have left to invest and affect how much risk makes sense. A range is enough.',
  tax:'Your tax bracket affects which accounts and investments may suit you. We estimate it from your income range, and your advisor will confirm it.',
  networth:'Your net worth shows how large your investments are compared with everything you own, which affects how much risk you can take. It is optional.',
  horizon:'Money you need soon should take less risk than money you will not touch for many years.',
  emergency:'Savings set aside for emergencies mean you will not have to sell investments at a bad time.',
  withdrawal:'If you plan to take money out regularly, early losses can hurt more, so this affects how much risk makes sense.',
  liquidity:'Big costs coming soon, such as a home purchase or tuition, should not depend on the stock market.',
  dependents:'People who rely on you financially make steady, safer choices more important.',
  homeOwn:'Your home is often your largest asset and a major cost, so it shapes your overall picture.',
  homeValue:'This helps your advisor see your whole financial picture. An estimate is fine.',
  retireAge:'The age you stop working changes how long your money has to last and to grow.',
  guaranteed:'Income such as Social Security or a pension can cover everyday costs, which changes how much risk the rest of your money can take.',
  workPlan:'A workplace plan is often a large part of your savings, so your advisor looks at it together with the rest.',
  holdTotal:'We use the total to turn your percentages into dollar amounts. An estimate is fine.'
};

/* ----- ranges that replace exact dollar figures ----- */
const INCOME_RANGES = [
  {label:'Under $30,000',lo:0,hi:30000},
  {label:'$30,000 to $60,000',lo:30000,hi:60000},
  {label:'$60,000 to $100,000',lo:60000,hi:100000},
  {label:'$100,000 to $150,000',lo:100000,hi:150000},
  {label:'$150,000 to $250,000',lo:150000,hi:250000},
  {label:'$250,000 to $500,000',lo:250000,hi:500000},
  {label:'$500,000 to $1,000,000',lo:500000,hi:1000000},
  {label:'More than $1,000,000',lo:1000000,hi:null},
  {label:'Prefer not to say'}
];
const DEBT_RANGES = [
  {label:'None',lo:0,hi:1},
  {label:'Under $25,000',lo:1,hi:25000},
  {label:'$25,000 to $100,000',lo:25000,hi:100000},
  {label:'$100,000 to $250,000',lo:100000,hi:250000},
  {label:'$250,000 to $500,000',lo:250000,hi:500000},
  {label:'$500,000 or more',lo:500000,hi:null},
  {label:'Prefer not to say'}
];

/* ----- U.S. federal income tax, tax year 2026 (IRS Rev. Proc. 2025-32) -----
   Taxable income up to each limit is taxed at that rate. Update every year, and update the tests with it. */
const TAX = {
  year: 2026,
  single:{ std:16100,  brackets:[[12400,10],[50400,12],[105700,22],[201775,24],[256225,32],[640600,35],[Infinity,37]] },
  mfj:   { std:32200,  brackets:[[24800,10],[100800,12],[211400,22],[403550,24],[512450,32],[768700,35],[Infinity,37]] }
};
const TAX_OPTIONS = ['Up to 12%','22% to 24%','32% to 35%','37%','Not known'];

/* ----- more profile choices ----- */
const HOME_OWN = ['Own, with a mortgage','Own, no mortgage','Rent','Live with family or other'];
const HOME_VALUE = ['Under $250,000','$250,000 to $500,000','$500,000 to $1,000,000','$1,000,000 to $2,000,000','More than $2,000,000','Not sure'];
const RETIRE_AGE = ['Already retired','Before 60','60 to 64','65 to 67','68 to 70','After 70','Not sure'];
const GUARANTEED = ['Yes, enough to cover most of my spending','Yes, but only part of my spending','No','Not sure'];
const WORK_PLAN = ['Yes, and I take part','Yes, but I do not take part','No','Not applicable'];
const ownsHome = v => /^Own/.test(String(v||''));

/* ----- sliders: one table for every page -----
   store says where the value lives ('cap' or 'profile'). hint is for clients, advisorHint for the advisor tool. */
const SLIDERS = {
  horizon:{key:'horizon',stepLabel:'One year',label:'Years until a large withdrawal might be needed',max:30,start:15,ticks:[0,5,10,15,20,25,30],last:'30+',
    text:v=>v<=0?'Less than 1 year':v===1?'1 year':v>=30?'30 or more years':v+' years',
    hint:'Drag the slider, or use the minus and plus buttons. Choose 0 if you may need it within a year.',
    advisorHint:'Time until the client expects to start drawing down this money. Drag the slider or use the buttons. Choose 0 if the money may be needed within a year.'},
  emergency:{key:'emergency',stepLabel:'One month',label:'Emergency reserves, in months',max:24,start:6,ticks:[0,6,12,18,24],last:'24+',
    text:v=>v<=0?'None':v===1?'1 month':v>=24?'24 or more months':v+' months',
    hint:'Cash outside this portfolio, in months of spending. Drag the slider, or use the minus and plus buttons. Choose 0 if you have none.',
    advisorHint:'Cash outside this portfolio, in months of spending. Drag the slider or use the buttons. Choose 0 if there are none.'},
  withdrawal:{key:'withdrawal',stepLabel:'Half a percent',label:'Planned withdrawals, % per year',max:12,step:0.5,start:3,ticks:[0,2,4,6,8,10,12],last:'12+',
    text:v=>v<=0?'None':v>=12?'12% or more a year':v+'% a year',
    hint:'Over the next five years. Drag the slider, or use the minus and plus buttons. Choose 0 if none.',
    advisorHint:'Over the next five years. Drag the slider or use the buttons. Choose 0 if none.'},
  liquidity:{key:'liquidity',stepLabel:'One percent',label:'Large expenses within 5 years, % of portfolio',max:50,start:10,ticks:[0,10,20,30,40,50],last:'50+',
    text:v=>v<=0?'None':v>=50?'50% or more of your portfolio':v+'% of your portfolio',
    hint:'Home purchase, tuition, and similar. Drag the slider, or use the minus and plus buttons. Choose 0 if none.',
    advisorHint:'Home purchase, tuition, and similar. Drag the slider or use the buttons. Choose 0 if none.'},
  dependents:{key:'dependents',stepLabel:'One person',label:'Financial dependents',max:8,start:1,ticks:[0,1,2,3,4,5,6,7,8],last:'8+',
    text:v=>v<=0?'None':v===1?'1 person':v>=8?'8 or more people':v+' people',
    hint:'People who rely on you financially. Drag the slider, or use the minus and plus buttons. Choose 0 if none.',
    advisorHint:'People who rely on the client financially. Drag the slider or use the buttons. Choose 0 if none.'},
  historyYears:{key:'historyYears',store:'profile',optional:true,stepLabel:'One year',label:'Years investing',max:40,start:10,ticks:[0,10,20,30,40],last:'40+',
    text:v=>v<=0?'Less than 1 year':v===1?'1 year':v>=40?'40 or more years':v+' years',
    hint:'Optional. Drag the slider, or use the minus and plus buttons. Leave it alone if you are not sure.',
    advisorHint:'Drag the slider or use the buttons. Leave it alone if unknown.'}
};

const CAP_FIELDS = [
  {k:'horizon',   label:SLIDERS.horizon.label,    type:'slider'},
  {k:'income',    label:'Income stability', type:'select', opts:[['5','Stable, covers all spending'],['4','Mostly stable, covers most spending'],['3','Variable, covers essentials'],['2','Unstable, covers little'],['1','None, relying on the portfolio']]},
  {k:'emergency', label:SLIDERS.emergency.label,  type:'slider'},
  {k:'withdrawal',label:SLIDERS.withdrawal.label, type:'slider'},
  {k:'liquidity', label:SLIDERS.liquidity.label,  type:'slider'},
  {k:'networth',  label:'Net worth excluding primary residence ($)', hint:'Optional. Used to size the portfolio against total wealth.', type:'number', step:'1000', optional:true, money:true},
  {k:'debt',      label:'Debt burden', type:'select', opts:[['5','Low, easily manageable'],['3','Moderate'],['1','High, strains monthly cash flow']]},
  {k:'dependents',label:SLIDERS.dependents.label, type:'slider'}
];
const INSURANCE = ['Life','Disability','Health','Long-term care','Umbrella liability'];
const HIST_OPTIONS = ['Stocks','Bonds','ETFs','Real Estate','Gold','Alternative Assets','Private Equity'], HIST_NONE = 'None of these';

/* ===== SHARED LOGIC (no page code in here, so it can be tested on its own) ===== */
const CAP_REQ = ['horizon','income','emergency','withdrawal','liquidity','debt','dependents'];
const capValid = v => v!=='' && v!=null && Number.isFinite(Number(v)) && Number(v)>=0;
const isoDate = (dt=new Date()) => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const usd = v => (v<0?'\u2212':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
async function sha256(str){
  try{
    if(!(typeof window!=='undefined' && window.crypto && crypto.subtle)) return null;
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

/* ----- income and debt ranges ----- */
function rangeLabelFor(list, v){
  if(v===''||v==null) return '';
  if(list.some(r=>r.label===v)) return String(v);
  const n=Number(String(v).replace(/[$,\s]/g,''));
  if(!Number.isFinite(n)||n<0) return String(v);
  const r=list.find(r=>r.lo!=null && n>=r.lo && (r.hi==null||n<r.hi));
  return r?r.label:String(v);
}
/* Records saved before ranges existed hold dollar figures. These turn them into the matching range. */
const incomeRangeFor = v => rangeLabelFor(INCOME_RANGES,v);
const debtRangeFor = v => rangeLabelFor(DEBT_RANGES,v);

/* ----- federal tax bracket estimate ----- */
function bucketOfRate(rate){ return rate<=12?'Up to 12%':rate<=24?'22% to 24%':rate<=35?'32% to 35%':'37%'; }
function rateFor(taxable, brackets){ for(const [limit,rate] of brackets){ if(taxable<=limit) return rate; } return brackets[brackets.length-1][1]; }
/* Taxable income is estimated as the income minus the standard deduction. Married couples are treated as filing jointly,
   everyone else as single. Returns null when there is no income range to work from. */
function estimateTaxBracket(incomeLabel, marital){
  const r=INCOME_RANGES.find(x=>x.label===incomeLabel);
  if(!r||r.lo==null) return null;
  const joint = marital==='Married or partnered', t = joint?TAX.mfj:TAX.single;
  const at = gross => bucketOfRate(rateFor(Math.max(0,gross-t.std),t.brackets));
  const top = r.hi==null?r.lo:r.hi, mid=(r.lo+top)/2;
  const lowB=at(r.lo), highB=at(top);
  return {bucket:at(mid), borderline:lowB!==highB, range:[lowB,highB], filing:joint?'married filing jointly':'single', year:TAX.year};
}
/* Fill the tax bracket from the estimate unless the person has chosen their own. st needs profile and taxAuto. */
function applyTaxEstimate(st){
  const est=estimateTaxBracket(st.profile.income, st.profile.marital);
  if(!est) return {est:null,changed:false};
  if(st.profile.tax===''||st.profile.tax===st.taxAuto){
    const changed=st.profile.tax!==est.bucket;
    st.profile.tax=est.bucket; st.taxAuto=est.bucket;
    return {est,changed};
  }
  return {est,changed:false};
}
function taxNote(est){
  if(!est) return '';
  let t='Estimated from your income range using the '+est.year+' U.S. federal brackets, as '+est.filing+'.';
  if(est.borderline) t+=' Your range could fall in "'+est.range[0]+'" or "'+est.range[1]+'". We picked the one for the middle of your range.';
  return t+' Change it if you know yours. Your advisor will confirm.';
}

/* Investments are entered as percentages. If any are entered they must add up to 100, and a total value is needed to turn them into dollars. */
function holdSummary(st){
  const pcts=HOLD_CLASSES.map((c,i)=>Number(st.hold[i])>0?Number(st.hold[i]):0);
  const pct=Math.round(pcts.reduce((a,b)=>a+b,0)*100)/100, count=pcts.filter(v=>v>0).length, value=Number(st.holdTotal)>0?Number(st.holdTotal):0;
  const issue = count===0 ? null : Math.abs(pct-100)>0.01 ? 'pct' : !value ? 'total' : null;
  return {pct,count,value,issue};
}
/* Turn the percentages and the total value into dollar amounts per asset class, the way the advisor tool stores them. */
function holdingsFrom(st){
  const total=Number(st.holdTotal);
  const rows=HOLD_CLASSES.map((c,i)=>({cls:c.cls,pct:Number(st.hold[i])})).filter(r=>r.pct>0);
  if(!rows.length||!(total>0)) return [];
  const sum=rows.reduce((a,r)=>a+r.pct,0);
  return rows.map(r=>({cls:r.cls,amt:String(Math.round(total*r.pct/sum))}));
}
/* What is still missing before the answers can be sent. where says which part of the questionnaire to open. */
function progress(st){
  const tolDone=st.tol.filter(v=>v!=null).length;
  const capDone=CAP_REQ.filter(k=>capValid(st.cap[k])).length;
  const missing=[];
  if(!st.consent) missing.push({label:'Your agreement to share your answers', where:'consent'});
  if(!st.name.trim()) missing.push({label:'Your name', where:'name'});
  if(capDone<CAP_REQ.length){ const n=CAP_REQ.length-capDone; missing.push({label:n+' required '+(n===1?'field':'fields')+' in Your finances', where:'cap'}); }
  if(tolDone<TOL_Q.length){ const n=TOL_Q.length-tolDone; missing.push({label:n+' '+(n===1?'question':'questions')+' about risk', where:'q', index:st.tol.findIndex(v=>v==null)}); }
  const hs=holdSummary(st);
  if(hs.issue==='pct') missing.push({label:'Your investments add up to '+hs.pct+'%, not 100%', where:'hold'});
  if(hs.issue==='total') missing.push({label:'Your investments: add the approximate total value', where:'hold'});
  return {tolDone,capDone,missing,complete:missing.length===0,holdCount:hs.count,holdPct:hs.pct,holdValue:hs.value,holdIssue:hs.issue};
}
function buildRecord(st, baselineMap){
  const rec = {
    schema:RECORD_SCHEMA,
    bandScale:BAND_SCALE,
    questionnaireVersion:QUESTIONNAIRE_VERSION,
    source:'client-questionnaire',
    exportedAt:new Date().toISOString(),
    previousRecordHash:null,
    revision:st.revision||1,
    supersedes:st.previous?{revision:st.previous.revision,exportedAt:st.previous.exportedAt,hash:st.previous.hash}:null,
    client:{name:st.name.trim(),advisor:st.advisor.trim()},
    consent:st.consent||null,
    profile:st.profile,
    review:{},
    inputs:{
      tolerance:TOL_Q.map((q,i)=>({question:q.q,answer:st.tol[i]?q.opts[st.tol[i]-1]:null,value:st.tol[i],points:st.tol[i]?tolScore(i,st.tol[i]):null})),
      capacity:st.cap,
      holdings:holdingsFrom(st),
      largestSecurityPct:capValid(st.maxPos)&&Number(st.maxPos)<=100?String(st.maxPos):''
    },
    decision:{override:'',rationale:''},
    register:[], riskSeq:0
  };
  /* what the client changed since the version they are replacing, with the ones that need the advisor's approval marked */
  if(st.previous && baselineMap) rec.changes = diffMaps(baselineMap, flatRows(rec));
  return rec;
}

/* ----- a plain-language description of a record: the review screen, the confirmation and the PDF all use this ----- */
function describeProfileValue(k,v){
  const f=PF.find(x=>x.k===k);
  if(v===''||v==null) return '';
  if(f&&f.type==='slider') return SLIDERS[k].text(Math.min(SLIDERS[k].max,Number(v)));
  if(f&&f.money) return usd(Number(v));
  return String(v);
}
function describeCapValue(f,v){
  if(v===''||v==null) return '';
  if(f.type==='slider') return SLIDERS[f.k].text(Math.min(SLIDERS[f.k].max,Number(v)));
  if(f.type==='select'){ const o=f.opts.find(x=>x[0]===String(v)); return o?o[1]:String(v); }
  if(f.money) return usd(Number(v));
  return String(v);
}
function describeAnswers(rec){
  const P=rec.profile||{}, I=rec.inputs||{}, C=I.capacity||{}, T=I.tolerance||[], H=I.holdings||[];
  const row=(key,label,value,extra)=>Object.assign({key,label,value:value==null?'':String(value)},extra||{});
  const sections=[];
  sections.push({id:'you',title:'About you',rows:[
    row('name','Name',(rec.client&&rec.client.name)||'',{required:true}),
    row('advisor','Your advisor',(rec.client&&rec.client.advisor)||'')]});
  const sit=[];
  PF.forEach(f=>{
    if(f.type==='note') return;
    if(f.showIf && !f.showIf(P)) return;
    if(f.type==='choices'){
      const v=String(P[f.k]||''), note=f.k==='goals'?String(P.goalsNote||''):'';
      sit.push(row('pf:'+f.k,f.label,v+(v&&note?' ('+note+')':(!v&&note?note:''))));
    } else sit.push(row('pf:'+f.k,f.label,describeProfileValue(f.k,P[f.k])));
  });
  sit.push(row('ins','Insurance',P.noInsurance?'None of the listed types':(P.insurance||[]).join(', ')));
  sections.push({id:'situation',title:'Your situation',rows:sit});
  sections.push({id:'finances',title:'Your finances',rows:CAP_FIELDS.map(f=>row('cap:'+f.k,f.label.replace(/ \(\$\)$/,''),describeCapValue(f,C[f.k]),{required:CAP_REQ.includes(f.k)}))});
  const inv=[];
  if(H.length){
    const total=H.reduce((a,x)=>a+Number(x.amt),0);
    H.forEach(x=>{ const c=HOLD_CLASSES.find(y=>y.cls===x.cls); const pct=total?Math.round(Number(x.amt)/total*1000)/10:0; inv.push(row('hold',c?c.label:'Class '+x.cls,pct+'% (about '+usd(Number(x.amt))+')')); });
    inv.push(row('hold','Total value of these investments','about '+usd(total)));
    if(I.largestSecurityPct) inv.push(row('hold','Largest single holding',I.largestSecurityPct+'% of your investments'));
  } else inv.push(row('hold','Investments','Not entered. Your advisor will add them from your statements.'));
  sections.push({id:'investments',title:'Your investments',rows:inv});
  sections.push({id:'risk',title:'How you feel about risk',rows:TOL_Q.map((q,i)=>row('q:'+i,'Question '+(i+1),(T[i]&&T[i].answer)||'',{required:true,qtext:q.q}))});
  return sections;
}
/* ----- changing answers after they were sent -----
   Each send is a numbered version. A new version names the file it replaces (its number, date and fingerprint),
   so the advisor can see the chain and what changed. */
const prettyDate = iso => { const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); };
function updateNote(rec){
  if(!rec||!rec.supersedes||!(rec.revision>1)) return '';
  const when=prettyDate(rec.supersedes.exportedAt);
  return 'Updated answers (version '+rec.revision+'). They replace the answers sent'+(when?' on '+when:'')+'.';
}
/* Dollar amounts per asset class back into percentages that add up to exactly 100, plus the total. */
function holdingsToPercents(holdings){
  const hold=Array(HOLD_CLASSES.length).fill(''); const rows=(Array.isArray(holdings)?holdings:[]).map(x=>({i:HOLD_CLASSES.findIndex(c=>c.cls===Number(x&&x.cls)),amt:Number(x&&x.amt)})).filter(r=>r.i>=0&&r.amt>0);
  const total=rows.reduce((a,r)=>a+r.amt,0);
  if(!rows.length) return {hold,total:''};
  const pcts=rows.map(r=>Math.round(r.amt/total*10000)/100);
  const drift=Math.round((100-pcts.reduce((a,b)=>a+b,0))*100)/100;
  const big=pcts.indexOf(Math.max(...pcts)); pcts[big]=Math.round((pcts[big]+drift)*100)/100;
  rows.forEach((r,k)=>{ hold[r.i]=String(pcts[k]); });
  return {hold,total:String(Math.round(total))};
}
/* Read a file the client sent earlier and turn it back into answers they can edit.
   parsed is the file as read from disk. hashFn is sha256 in a browser. Returns {ok:true,state,record,notes} or {ok:false,message}. */
async function readEarlierAnswers(parsed, hashFn, now){
  const str=v=>v==null?'':String(v);
  const rec=parsed&&typeof parsed==='object'?(parsed.record||null):null;
  if(!rec||rec.schema!==RECORD_SCHEMA||!rec.inputs||!rec.client) return {ok:false,message:'That file is not a saved questionnaire.'};
  if(rec.source!=='client-questionnaire') return {ok:false,message:'That file did not come from this questionnaire. Choose the file you sent to your advisor.'};
  if(EDIT_WINDOW_STRICT){
    const sentMs=new Date(rec.exportedAt).getTime(), nowMs=(now||new Date()).getTime();
    if(isNaN(sentMs)) return {ok:false,message:'We could not tell when that file was sent, so it cannot be changed. Please start a new questionnaire.'};
    if(nowMs-sentMs>EDIT_WINDOW_DAYS*86400000) return {ok:false,message:'That file is more than '+EDIT_WINDOW_DAYS+' days old, so it can no longer be changed. Please start a new questionnaire.'};
  }
  const text=JSON.stringify(rec), computed=hashFn?await hashFn(text):null;
  if(parsed.sha256&&computed&&computed!==parsed.sha256) return {ok:false,message:'That file has changed since it was saved, so it cannot be used. Choose the file you sent.'};
  const hash=parsed.sha256||computed||'';
  const st=freshState(), I=rec.inputs, P=rec.profile||{}, notes=[];
  st.name=str(rec.client.name); st.advisor=str(rec.client.advisor);
  if(rec.questionnaireVersion===QUESTIONNAIRE_VERSION){
    st.tol=TOL_Q.map((q,i)=>{ const t=(I.tolerance||[])[i], v=t&&Number(t.value); return v>=1&&v<=q.opts.length?v:null; });
  } else notes.push('The risk questions have changed since you sent this file, so please answer them again.');
  CAP_FIELDS.forEach(f=>{ st.cap[f.k]=str((I.capacity||{})[f.k]); });
  Object.keys(st.profile).forEach(k=>{ if(k!=='insurance'&&k!=='noInsurance') st.profile[k]=str(P[k]); });
  st.profile.insurance=Array.isArray(P.insurance)?P.insurance.filter(x=>INSURANCE.includes(x)):[];
  st.profile.noInsurance=!!P.noInsurance;
  st.profile.income=incomeRangeFor(st.profile.income); st.profile.debtTotal=debtRangeFor(st.profile.debtTotal);
  const est=estimateTaxBracket(st.profile.income,st.profile.marital);
  st.taxAuto=(est&&st.profile.tax===est.bucket)?est.bucket:'';
  const hp=holdingsToPercents(I.holdings); st.hold=hp.hold; st.holdTotal=hp.total; st.maxPos=str(I.largestSecurityPct);
  st.consent=null;                                   /* a new send needs a new agreement */
  const rev=Number(rec.revision)>=1?Number(rec.revision):1;
  st.revision=rev+1; st.previous={revision:rev,exportedAt:str(rec.exportedAt),hash};
  return {ok:true,state:st,record:rec,notes};
}
/* Answers as {key:{label,value}}, so two versions can be compared. */
function flatRows(rec){
  const out={};
  describeAnswers(rec).forEach(sec=>sec.rows.forEach(r=>{ out[r.key==='hold'?'hold:'+r.label:r.key]={label:r.qtext?r.qtext:r.label,short:r.label,value:r.value,section:sec.title}; }));
  return out;
}
/* What is different between an earlier and a later version of the answers, in reading order. */
function diffMaps(a,b){
  const keys=[...Object.keys(b),...Object.keys(a).filter(k=>!(k in b))], out=[];
  keys.forEach(k=>{
    const from=a[k]?a[k].value:'', to=b[k]?b[k].value:'';
    if(from!==to) out.push({key:k,label:(b[k]||a[k]).label,short:(b[k]||a[k]).short,section:(b[k]||a[k]).section,from:from||'Not answered',to:to||'Not answered',needsApproval:needsApproval(k)});
  });
  return out;
}
const diffAnswers = (oldRec,newRec) => diffMaps(flatRows(oldRec),flatRows(newRec));
const approvalItems = list => (Array.isArray(list)?list:[]).filter(x=>x&&needsApproval(x.key));
function pdfDocFor(rec, now){
  now = now||new Date();
  const when=now.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const name=(rec.client&&rec.client.name)||'', adv=(rec.client&&rec.client.advisor)||'';
  const lines=['Prepared for '+(name||'you')+' on '+when+'.'];
  if(adv) lines.push('Your advisor: '+adv+' at '+PRIVACY.firm+'.'); else lines.push('Shared with '+PRIVACY.firm+'.');
  const upd=updateNote(rec); if(upd) lines.push(upd);
  const until=editUntilText(rec.exportedAt); if(until) lines.push(until);
  const waiting=approvalItems(rec.changes); if(waiting.length) lines.push('Some of these changes need your advisor\u2019s approval before they take effect.');
  if(rec.consent&&rec.consent.acceptedAt) lines.push('You agreed to share these answers on '+new Date(rec.consent.acceptedAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})+'.');
  return {
    title:'Your investor questionnaire',
    lines,
    sections:[...(Array.isArray(rec.changes)&&rec.changes.length?[{title:'Changes since your earlier answers',rows:rec.changes.map(c=>[c.label+(c.needsApproval?' (needs approval)':''),c.from+' to '+c.to])}]:[]),
      ...describeAnswers(rec).filter(s=>s.id!=='you').map(s=>({title:s.title,rows:s.rows.map(r=>[r.qtext||r.label,r.value])}))],
    footer:'A copy of the answers you sent to your advisor. It contains no scores or recommendations.',
    info:{title:'Your investor questionnaire',author:PRIVACY.firm}
  };
}

/* Characters outside plain ASCII that the standard fonts can show, as WinAnsi codes. */
const PDF_WINANSI = {'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2013':0x96,'\u2014':0x97,'\u2026':0x85,'\u2022':0x95,'\u2212':0x2D,'\u00A0':0x20,'\u20AC':0x80};
function pdfCode(ch){
  const c=ch.charCodeAt(0);
  if(PDF_WINANSI[ch]!==undefined) return PDF_WINANSI[ch];
  if(c>=32&&c<=126) return c;
  if(c>=160&&c<=255) return c;
  return 63;
}
function pdfWidth(text,size,bold){
  const w=bold?PDF_WIDTHS.bold:PDF_WIDTHS.regular; let t=0;
  for(const ch of String(text)){ const code=pdfCode(ch); t+=(w[code-32]!==undefined?w[code-32]:556); }
  return t*size/1000;
}
function pdfEscape(text){
  let out='';
  for(const ch of String(text)){
    const s=String.fromCharCode(pdfCode(ch));
    out+= (s==='('||s===')'||s==='\\') ? '\\'+s : s;
  }
  return out;
}
function pdfWrap(text,size,bold,maxWidth){
  const lines=[];
  String(text).split(/\n/).forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean); let cur='';
    if(!words.length){ lines.push(''); return; }
    words.forEach(w=>{
      /* a single word wider than the line is cut */
      while(pdfWidth(w,size,bold)>maxWidth){
        let n=w.length; while(n>1&&pdfWidth(w.slice(0,n),size,bold)>maxWidth) n--;
        if(cur){ lines.push(cur); cur=''; }
        lines.push(w.slice(0,n)); w=w.slice(n);
      }
      const trial=cur?cur+' '+w:w;
      if(pdfWidth(trial,size,bold)<=maxWidth) cur=trial; else { if(cur) lines.push(cur); cur=w; }
    });
    if(cur) lines.push(cur);
  });
  return lines;
}
/* doc: {title, lines:[strings under the title], sections:[{title, rows:[[label,value]]}], footer, info:{title,author}}
   Returns the PDF as a Uint8Array. */
function buildPdf(doc){
  const W=612,H=792,M=54,TOP=H-62,BOTTOM=72,LABEL_W=170,GAP=14,VALUE_X=M+LABEL_W+GAP,VALUE_W=W-M-VALUE_X;
  const pages=[[]]; let y=TOP;
  const cur=()=>pages[pages.length-1];
  const newPage=()=>{ pages.push([]); y=TOP; };
  const need=hh=>{ if(y-hh<BOTTOM) newPage(); };
  const text=(x,yy,str,size,bold)=>cur().push('BT /'+(bold?'F2':'F1')+' '+size+' Tf 1 0 0 1 '+x.toFixed(2)+' '+yy.toFixed(2)+' Tm ('+pdfEscape(str)+') Tj ET');
  const rule=(yy,gray)=>cur().push((gray||0.8)+' G 0.6 w '+M+' '+yy.toFixed(2)+' m '+(W-M)+' '+yy.toFixed(2)+' l S');
  text(M,y,doc.title,20,true); y-=26;
  (doc.lines||[]).forEach(l=>{ pdfWrap(l,10.5,false,W-2*M).forEach(s=>{ need(15); text(M,y,s,10.5,false); y-=15; }); });
  y-=6; rule(y); y-=20;
  (doc.sections||[]).forEach(sec=>{
    const rows=(sec.rows||[]).filter(r=>r[1]!==''&&r[1]!=null);
    if(!rows.length) return;
    need(60); text(M,y,sec.title,13,true); y-=8; rule(y,0.6); y-=16;
    rows.forEach(r=>{
      const L=pdfWrap(r[0],9.5,true,LABEL_W), V=pdfWrap(String(r[1]),10.5,false,VALUE_W), n=Math.max(L.length,V.length);
      need(n*14+6);
      for(let i=0;i<n;i++){ if(L[i]) text(M,y-i*14,L[i],9.5,true); if(V[i]) text(VALUE_X,y-i*14,V[i],10.5,false); }
      y-=n*14+6;
    });
    y-=10;
  });
  const total=pages.length;
  pages.forEach((p,i)=>{
    p.push('BT /F1 8.5 Tf 1 0 0 1 '+M+' 40 Tm ('+pdfEscape(doc.footer||'')+') Tj ET');
    const label='Page '+(i+1)+' of '+total;
    p.push('BT /F1 8.5 Tf 1 0 0 1 '+(W-M-pdfWidth(label,8.5,false)).toFixed(2)+' 40 Tm ('+pdfEscape(label)+') Tj ET');
  });
  /* objects: 1 catalog, 2 pages, 3 regular font, 4 bold font, 5 info, then a content stream and a page for each page */
  const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const info=doc.info||{};
  add('<< /Title ('+pdfEscape(info.title||doc.title)+') /Author ('+pdfEscape(info.author||'')+') /Producer (Investor questionnaire) >>');
  const kids=[];
  pages.forEach(p=>{
    const body=p.join('\n');
    const contentId=add('<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream');
    const pageId=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+contentId+' 0 R >>');
    kids.push(pageId+' 0 R');
  });
  objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
  let out='%PDF-1.4\n'; const offsets=[];
  objs.forEach((o,i)=>{ offsets.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  const xref=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offsets.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R /Info 5 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
function pdfToBase64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(s); }

/* ===== SHARED UI HELPERS ===== */
const $ = (s,r=document)=>r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
/* A short "Why we ask" note that opens when tapped. */
function whyNote(text){ return h('details',{class:'why'},h('summary',{},'Why we ask'),h('p',{},text)); }

/* One form field. o: {onChange(key,value), bad, why}. */
function buildField(f, obj, prefix, o){
  o=o||{};
  const id=prefix+f.k, on=e=>{ obj[f.k]=e.target.value; if(o.onChange) o.onChange(f.k,e.target.value); };
  let control;
  if(f.type==='select'){
    const opts=(f.opts||[]).map(x=>Array.isArray(x)?{v:x[0],t:x[1]}:{v:x,t:x});
    control=h('select',{id,onchange:on},h('option',{value:''},'Select'),opts.map(x=>h('option',{value:x.v},x.t)));
  } else if(f.type==='textarea') control=h('textarea',{id,oninput:on});
  else control=h('input',{id,type:f.type||'text',step:f.step,min:f.type==='number'?'0':null,inputmode:f.type==='number'?'decimal':null,autocomplete:'off',oninput:on});
  control.value = obj[f.k]==null ? '' : obj[f.k];
  const why = o.why && WHY[f.k] ? whyNote(WHY[f.k]) : null;
  return h('div',{class:'field'+(f.wide?' wide':'')+(o.bad?' bad':'')},h('label',{for:id},f.label),f.hint?h('span',{class:'hint'},f.hint):null,why,control,o.bad?h('p',{class:'err'},'Required'):null);
}

/* A slider with a large readout, minus and plus buttons and a number scale.
   cfg is an entry of SLIDERS. o: {store, onChange(key), wide, bad, why, hint, unsetText}. The returned element has refresh(). */
function makeRange(cfg, o){
  const store=o.store, max=cfg.max, step=cfg.step||1, id=(cfg.store==='profile'?'pf-':'cap-')+cfg.key;
  const okv=v=>v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>=0;
  const snap=v=>Math.round(Math.max(0,Math.min(max,Math.round(v/step)*step))*100)/100;
  const shown=v=>cfg.text(Math.min(max,v));
  const out=h('div',{class:'hz-out unset','aria-hidden':'true'},o.unsetText||'Slide to choose');
  const rng=h('input',{id,type:'range',min:'0',max:String(max),step:String(step),'aria-label':cfg.label});
  const box=h('div',{class:'field hz unset'});
  const errEl=(o.bad&&!cfg.optional)?h('p',{class:'err'},'Required'):null;
  const refresh=()=>{
    const good=okv(store[cfg.key]), raw=Number(store[cfg.key]), v=good?snap(raw):cfg.start;
    rng.value=String(v); rng.setAttribute('style','--pct:'+(v/max*100)+'%');
    out.textContent=good?shown(raw):(o.unsetText||'Slide to choose'); out.className='hz-out'+(good?'':' unset');
    box.className='field'+(o.wide?' wide':'')+' hz'+(good?'':' unset')+((o.bad&&!good&&errEl)?' bad':'');
    if(good) rng.setAttribute('aria-valuetext',shown(raw));
    if(errEl) errEl.hidden=good;
  };
  const apply=v=>{ store[cfg.key]=String(snap(v)); refresh(); if(o.onChange) o.onChange(cfg.key); };
  const cur=()=>Math.min(max,Number(store[cfg.key]));
  rng.addEventListener('input',e=>apply(Number(e.target.value)));
  const minus=h('button',{type:'button',class:'step','aria-label':cfg.stepLabel+' less',onclick:()=>apply(okv(store[cfg.key])?cur()-step:cfg.start-step)},'\u2212');
  const plus=h('button',{type:'button',class:'step','aria-label':cfg.stepLabel+' more',onclick:()=>apply(okv(store[cfg.key])?cur()+step:cfg.start+step)},'+');
  const ticks=h('div',{class:'hz-ticks','aria-hidden':'true'},cfg.ticks.map(n=>h('span',{style:'left:'+(n/max*100)+'%'},n===max?cfg.last:String(n))));
  box.append(h('label',{for:id},cfg.label),h('span',{class:'hint'},o.hint||cfg.hint),(o.why&&WHY[cfg.key])?whyNote(WHY[cfg.key]):'',out,
    h('div',{class:'hz-row'},minus,h('div',{class:'hz-track'},rng,ticks),plus));
  if(errEl) box.append(errEl);
  box.refresh=refresh; refresh();
  return box;
}

/* Tick-box rows for a list stored as text ("Stocks, Bonds"). o: {options, none, get(), set(text), onChange(), keepExtra, rowClass}.
   keepExtra keeps text from earlier records that matches no option. Returns {rows, refresh, extra}. */
function choiceRows(o){
  const all=o.none?[...o.options,o.none]:o.options.slice(), boxes={};
  const tokens=()=>String(o.get()||'').split(', ').filter(Boolean);
  const extra=()=>o.keepExtra?tokens().filter(t=>!all.includes(t)):[];
  const refresh=()=>{ const toks=tokens(); all.forEach(x=>{ boxes[x].checked=toks.includes(x); }); };
  const sync=changed=>{
    if(o.none&&changed===o.none&&boxes[o.none].checked) o.options.forEach(x=>{ boxes[x].checked=false; });
    else if(o.none&&changed!==o.none) boxes[o.none].checked=false;
    const picked=o.options.filter(x=>boxes[x].checked); if(o.none&&boxes[o.none].checked) picked.push(o.none);
    o.set([...picked,...extra()].join(', ')); if(o.onChange) o.onChange();
  };
  const rows=all.map(x=>{ const i=h('input',{type:'checkbox',onchange:()=>sync(x)}); boxes[x]=i; return h('label',{class:o.rowClass||'opt'},i,h('span',{},x)); });
  refresh();
  return {rows,refresh,extra};
}
/* Insurance is stored as a list plus a flag, so it gets its own adapter around choiceRows. */
function insuranceRows(P, onChange, rowClass){
  return choiceRows({options:INSURANCE, none:'None of these', rowClass,
    get:()=>P.noInsurance?'None of these':P.insurance.join(', '),
    set:txt=>{ P.noInsurance=/None of these/.test(txt); P.insurance=P.noInsurance?[]:txt.split(', ').filter(Boolean); },
    onChange});
}

/* The screen that holds the answer behind a row of the review list. */
function stepFor(key){
  if(key==='name'||key==='advisor') return IDX.you;
  if(key==='consent') return IDX.consent;
  if(key==='ins') return IDX.ins;
  if(key==='hold') return IDX.hold;
  const [kind,k]=key.split(':');
  if(kind==='q') return IDX.q+Number(k);
  if(kind==='cap') return steps.findIndex(s=>s.t==='cap'&&s.keys.includes(k));
  if(kind==='pf') return steps.findIndex(s=>s.t==='profile'&&s.keys.includes(k));
  return IDX.you;
}
/* What is still missing on one screen. Returns a list of keys. */
function stepMissing(s){
  if(s.t==='consent') return state.consent?[]:['consent'];
  if(s.t==='you') return state.name.trim()?[]:['name'];
  if(s.t==='cap') return s.keys.filter(k=>CAP_REQ.includes(k)&&!capValid(state.cap[k]));
  if(s.t==='q') return state.tol[s.i]==null?['q']:[];
  if(s.t==='hold'&&s.maxPos) return progress(state).holdIssue?['hold']:[];
  if(s.t==='review') return progress(state).complete?[]:['review'];
  return [];
}
/* Where a "missing" item in the review list should take the client. */
function stepForMissing(m){
  if(m.where==='consent') return IDX.consent;
  if(m.where==='name') return IDX.you;
  if(m.where==='cap') return IDX.cap;
  if(m.where==='hold') return IDX.hold;
  if(m.where==='q') return IDX.q+Math.max(0,m.index);
  return IDX.review;
}

/* ----- draft (saved on this device only, deleted after 7 days or on request) ----- */
const DRAFT_KEY = 'investor-qq-draft-v1', DRAFT_MS = EDIT_WINDOW_DAYS*24*3600*1000;
function loadDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY); if(!raw) return null;
    const d=JSON.parse(raw);
    /* answers already sent are kept for EDIT_WINDOW_DAYS from the send, whatever happens after. Unsent answers, EDIT_WINDOW_DAYS from the last visit. */
    const sentMs=d&&d.state&&d.state.sentAt?new Date(d.state.sentAt).getTime():NaN, from=isNaN(sentMs)?(d&&d.savedAt):sentMs;
    if(!d||!d.state||!(Date.now()-from<=DRAFT_MS)){ localStorage.removeItem(DRAFT_KEY); return null; }
    return d;
  }catch(e){ return null; }
}
function saveDraft(step){ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({savedAt:Date.now(),step,ver:3,state,baseline,updateNotes})); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function applyDraft(d){
  const f=freshState(), s=d.state||{};
  state.name=String(s.name||''); state.advisor=String(s.advisor||'');
  state.tol=TOL_Q.map((q,i)=>{ const v=Number((s.tol||[])[i]); return v>=1&&v<=q.opts.length?v:null; });
  Object.keys(f.cap).forEach(k=>{ state.cap[k]=String((s.cap||{})[k]==null?'':s.cap[k]); });
  const P=s.profile||{};
  Object.keys(f.profile).forEach(k=>{ if(k!=='insurance'&&k!=='noInsurance') state.profile[k]=String(P[k]==null?'':P[k]); });
  state.profile.insurance=Array.isArray(P.insurance)?P.insurance.filter(x=>INSURANCE.includes(x)):[];
  state.profile.noInsurance=!!P.noInsurance;
  state.profile.income=incomeRangeFor(state.profile.income); state.profile.debtTotal=debtRangeFor(state.profile.debtTotal);   /* drafts from before ranges hold dollars */
  state.taxAuto=String(s.taxAuto||'');
  state.sentAt=String(s.sentAt||'');
  state.revision=Number(s.revision)>=1?Number(s.revision):1;
  state.previous=(s.previous&&typeof s.previous==='object'&&s.previous.hash!=null)?{revision:Number(s.previous.revision)||1,exportedAt:String(s.previous.exportedAt||''),hash:String(s.previous.hash||'')}:null;
  baseline=(d.baseline&&typeof d.baseline==='object')?d.baseline:null; updateNotes=Array.isArray(d.updateNotes)?d.updateNotes:[];
  state.consent=(s.consent&&s.consent.acceptedAt)?{version:String(s.consent.version||''),acceptedAt:String(s.consent.acceptedAt),approved:!!s.consent.approved}:null;
  /* Drafts saved before version 2 held dollar amounts here, so they are not reused as percentages. */
  const keep=d.ver>=2;
  state.hold=HOLD_CLASSES.map((c,i)=>keep?String((s.hold||[])[i]==null?'':s.hold[i]):'');
  state.maxPos=keep?String(s.maxPos==null?'':s.maxPos):'';
  state.holdTotal=keep?String(s.holdTotal==null?'':s.holdTotal):'';
}

const touch = ()=>{ saveDraft(stepIdx); updateMeter(); };
function updateMeter(){
  const m=$('#meter'); if(!m) return;
  const p=progress(state), pct=Math.min(100,p.holdPct);
  m.className='meter'+(p.holdCount&&Math.abs(p.holdPct-100)<=0.01?' full':p.holdPct>100?' over':'');
  $('#meter-fill').style.width=pct+'%';
  $('#meter-pct').textContent=p.holdCount?p.holdPct+'%':'0%';
  $('#meter-text').textContent=!p.holdCount?'Nothing entered yet. This section is optional.':Math.abs(p.holdPct-100)<=0.01?'All 100% allocated':p.holdPct>100?'Over by '+Math.round((p.holdPct-100)*100)/100+'%. Lower a percentage.':'Allocated, '+Math.round((100-p.holdPct)*100)/100+'% left';
}
/* Every screen is a history entry, so the phone's back swipe or back button moves one screen back instead of leaving the questionnaire. */
const sid = Date.now().toString(36)+Math.random().toString(36).slice(2,6);   /* marks this page load, so entries left over from before a reload are ignored */
const clampStep = n => Math.max(0,Math.min(steps.length-1,n));
const show = n => { stepIdx=clampStep(n); if(steps[stepIdx].t==='review') returnToReview=false; showErrors=false; render(); try{ window.scrollTo(0,0); }catch(e){} };
const go = n => { n=clampStep(n); if(n===stepIdx){ show(n); return; } try{ history.pushState({step:n,sid},''); }catch(e){} show(n); };
window.addEventListener('popstate',e=>{
  const st=e.state;
  if(st&&st.sid===sid&&typeof st.step==='number') show(st.step);
  else { try{ history.replaceState({step:0,sid},''); }catch(err){} show(0); }
});
/* Open the screen behind a review row and come back to the review when done. */
const editRow = key => { returnToReview=true; go(stepFor(key)); };
const finishEdit = () => { returnToReview=false; go(IDX.review); };

    }
    if(SLIDERS[k]){ wrap.append(makeRange(SLIDERS[k],{store:state.profile,onChange:touch,why:true})); return; }
    if(k==='tax') applyTaxEstimate(state);

/* ----- reopening an earlier file ----- */
const readText = file => file.text ? file.text() : new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsText(file); });
const record = () => buildRecord(state, baseline);
const hasAnswers = () => state.name.trim()!=='' || state.tol.some(v=>v!=null);
async function loadEarlierFile(file,msg){
  let parsed;
  try{ parsed=JSON.parse(await readText(file)); }catch(e){ msg.textContent='That file could not be read. Choose the file you sent to your advisor.'; return; }
  const r=await readEarlierAnswers(parsed,sha256);
  if(!r.ok){ msg.textContent=r.message; return; }
  if((draft||hasAnswers())&&!window.confirm('This replaces the answers saved on this device with the answers from that file. Continue?')) return;
  Object.assign(state,r.state); baseline=flatRows(r.record); updateNotes=r.notes; draft=null;
  returnToReview=true; saveDraft(IDX.consent); go(IDX.consent);
}

/* ----- sending ----- */
async function makeFile(){
  const rec=record(), hash=await sha256(JSON.stringify(rec));
  const out={record:rec,note:'Client questionnaire. Load this file in the advisor risk profile tool.'};
  if(hash) out.sha256=hash;
  return {text:JSON.stringify(out,null,2), name:answersFileName(rec,'json')};
}
function browserDownload(name,data,type){
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=h('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
/* Inside the native app: save a file to the app's temporary folder, open the iPhone share sheet, then delete the file. */
async function nativeShare(name,data,isBase64,title){
  const C=window.Capacitor, FS=C.registerPlugin('Filesystem'), SH=C.registerPlugin('Share');
  const opts={path:name,data,directory:'CACHE'}; if(!isBase64) opts.encoding='utf8';
  const saved=await FS.writeFile(opts);
  try{ await SH.share({title,text:title,url:saved.uri,dialogTitle:'Send to your advisor'}); }
  finally{ try{ await FS.deleteFile({path:name,directory:'CACHE'}); }catch(e){} }
}
const wasCancelled = e => /cancel/i.test(String((e&&(e.message||e.errorMessage))||e)) || (e&&e.name==='AbortError');
/* Returns true when the answers were handed over (shared or downloaded). */
async function sendFile(viaShare,status){
  if(!progress(state).complete){ status.textContent='Some required answers are missing. Go back to the review.'; return false; }
  const f=await makeFile();
  let ok=false;
  if(isNative()){
    try{ await nativeShare(f.name,f.text,false,'Investor questionnaire'); ok=true; }
    catch(e){ if(wasCancelled(e)) return false; status.textContent='Could not open the share sheet. Close the app, open it again and try once more.'; return false; }
  } else {
    try{
      if(viaShare){
        const file=new File([f.text],f.name,{type:'application/json'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Investor questionnaire'}); ok=true; }
      }
      if(!ok){ browserDownload(f.name,f.text,'application/json'); ok=true; }
    }catch(e){ if(wasCancelled(e)) return false; status.textContent='Could not send the file. Try Download my answers instead.'; return false; }
  }
  if(ok){ state.sentAt=new Date().toISOString(); saveDraft(IDX.finish); go(IDX.sent); }
  return ok;
}
/* The copy the client keeps: a PDF of their own answers, with no scores. */
async function savePdf(status){
  const rec=record(), bytes=buildPdf(pdfDocFor(rec)), name=answersFileName(rec,'pdf');
  try{
    if(isNative()){ await nativeShare(name,pdfToBase64(bytes),true,'My questionnaire answers'); status.textContent='Saved.'; return; }
    const file=new File([bytes],name,{type:'application/pdf'});
    if(typeof navigator.canShare==='function'&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'My questionnaire answers'}); status.textContent='Saved.'; return; }
    browserDownload(name,bytes,'application/pdf'); status.textContent='Downloaded.';
  }catch(e){ if(wasCancelled(e)) return; status.textContent='Could not save the PDF. Try again.'; }
}

/* ----- the course line across the top ----- */
const waypoints=[];
/* Position on the course line, 0 to 100. Waypoints sit at equal spacing; the buoy moves between them as the client works through a section. */
function courseAt(i){
  const sec=SECTION_OF[steps[i].t]; if(sec<0) return 0;
  const first=SECTIONS[sec].start, n=(SECTIONS[sec+1]?SECTIONS[sec+1].start:steps.length)-first;
  return Math.min(100,(sec+(i-first)/n)/(SECTIONS.length-1)*100);
}
function buildCourse(){
  const track=$('#track');
  SECTIONS.forEach((x,i)=>{ const at=i/(SECTIONS.length-1)*100; const w=h('i',{class:'wp',style:'left:'+at+'%'}); waypoints.push({el:w,at}); track.append(w); });
  const bu=$('#buoy'); if(bu&&bu.parentNode===track){ track.append(bu); }
}
function render(){
  const s=steps[stepIdx], pct=Math.round(courseAt(stepIdx)), sec=SECTION_OF[s.t];
  $('#fill').style.width=pct+'%';
  $('#buoy').style.left=pct+'%';
  waypoints.forEach(w=>w.el.className='wp'+(pct>=w.at-0.5?' done':''));
  $('#track').setAttribute('aria-valuenow',String(pct));
  $('#m-left').textContent = sec>=0 ? SECTIONS[sec].name : '';
  $('#m-right').textContent = s.t==='q' ? 'Question '+(s.i+1)+' of '+TOL_Q.length : (s.t==='cap'||s.t==='hold') ? 'Part '+s.part : '';
  focusEl=null;
  const scr=$('#screen'); scr.replaceChildren(screenFor(s));
  const foot=$('#foot');
  foot.hidden = s.t==='welcome'||s.t==='finish'||s.t==='sent';
  $('#meter').hidden = s.t!=='hold'; updateMeter();
  $('#back').disabled = stepIdx===0;
  const nx=$('#next');
  nx.textContent = s.t==='review' ? 'Continue' : returnToReview ? 'Save and return to review' : 'Next';
  nx.disabled = s.t==='review' ? !progress(state).complete : false;
  if(stepIdx>0&&s.t!=='sent') saveDraft(stepIdx);
  if(focusEl&&focusEl.focus){ try{ focusEl.focus({preventScroll:true}); }catch(e){} }
}
$('#back').addEventListener('click',()=>{
  const st=(typeof history!=='undefined')?history.state:null;
  if(st&&st.sid===sid&&typeof st.step==='number'&&st.step===stepIdx&&stepIdx>0){ try{ history.back(); return; }catch(e){} }
  show(stepIdx-1);
});
$('#next').addEventListener('click',()=>{
  const miss=stepMissing(steps[stepIdx]);
  if(miss.length){ showErrors=true; render(); return; }
  if(returnToReview&&steps[stepIdx].t!=='review') finishEdit(); else go(stepIdx+1);
});
draft=loadDraft();
try{ history.replaceState({step:0,sid},''); }catch(e){}
buildCourse();
render();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&!isNative()&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
app.go=go; app.render=render; app.getStep=()=>stepIdx; app.getDraft=()=>draft; app.setDraft=d=>{draft=d;};
}
if(typeof window!=='undefined') window.__app=Object.assign(app,{state,steps,stepMissing,stepFor,progress,buildRecord,loadDraft,saveDraft,clearDraft,applyDraft,resetState,IDX});

</script>
</body>
</html>
